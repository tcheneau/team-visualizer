# Apache reverse proxy for Team Visualizer
# Proxies all HTTP and WebSocket traffic to the Go app.
# TLS block included (commented out) for production deployments.

<VirtualHost *:80>
    ServerName localhost

    # --- WebSocket support for /api/ws ---
    # Upgrade HTTP connections to WebSocket and proxy to the app.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://teamviz:8080/$1" [P,L]

    # --- Regular HTTP proxy ---
    ProxyPreserveHost On
    ProxyPass / http://teamviz:8080/
    ProxyPassReverse / http://teamviz:8080/

    # --- Optional TLS configuration (uncomment and provide certs for HTTPS) ---
    # Requires: LoadModule ssl_module modules/mod_ssl.so
    #
    # SSLEngine on
    # SSLCertificateFile /usr/local/apache2/conf/server.crt
    # SSLCertificateKeyFile /usr/local/apache2/conf/server.key
    # SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    # SSLCipherSuite HIGH:!aNULL:!MD5
    #
    # For production, also set:
    # RequestHeader set X-Forwarded-Proto https
</VirtualHost>
