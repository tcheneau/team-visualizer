# ============================================================
# Apache reverse proxy with Kerberos (SPNEGO) authentication
# and LDAP group → role mapping for Team Visualizer
# ============================================================
#
# Authenticates the browser via Kerberos/SPNEGO, looks up the
# user's AD/LDAP group memberships, and forwards both the
# username (X-Dev-User) and mapped groups (X-Dev-Groups) to
# Team Visualizer. The app runs with TVZ_DEV_MODE=true.
#
# Flow:
#   Browser (Kerberos ticket)
#     → Apache mod_auth_gssapi (validates ticket, sets REMOTE_USER)
#     → Apache mod_lua/group_lookup.lua (LDAP group query → X-Dev-Groups)
#     → Apache mod_proxy (forwards to Team Visualizer)
#     → Team Visualizer (reads X-Dev-User + X-Dev-Groups, authenticates)
#
# ============================================================
# Prerequisites
# ============================================================
#
#  1. Service principal + keytab
#
#     Active Directory (on a DC or with RSAT tools):
#       setspn -S HTTP/teamviz.example.com EXAMPLE\svc-apache-teamviz
#       ktpass -princ HTTP/teamviz.example.com@EXAMPLE.COM \
#         -mapuser EXAMPLE\svc-apache-teamviz -pass "ServicePassword!" \
#         -out C:\teamviz.keytab -crypto AES256-SHA1 -ptype KRB5_NT_PRINCIPAL
#
#     MIT Kerberos:
#       kadmin: addprinc -randkey HTTP/teamviz.example.com@EXAMPLE.COM
#       kadmin: ktadd -k /etc/httpd/teamviz.keytab HTTP/teamviz.example.com@EXAMPLE.COM
#
#     Copy the keytab to the Apache server:
#       scp teamviz.keytab apache-host:/etc/httpd/teamviz.keytab
#       chown apache:apache /etc/httpd/teamviz.keytab   (or www-data on Debian)
#       chmod 400 /etc/httpd/teamviz.keytab
#
#  2. /etc/krb5.conf on the Apache host
#
#       [libdefaults]
#       default_realm = EXAMPLE.COM
#       rdns = false
#
#       [realms]
#       EXAMPLE.COM = {
#           kdc = dc1.example.com
#           admin_server = dc1.example.com
#       }
#
#       [domain_realm]
#       .example.com = EXAMPLE.COM
#       example.com = EXAMPLE.COM
#
#     Verify with:
#       kinit -k -t /etc/httpd/teamviz.keytab HTTP/teamviz.example.com@EXAMPLE.COM
#       kvno HTTP/teamviz.example.com@EXAMPLE.COM
#
#  3. DNS
#
#     The hostname in the SPN must match what the browser connects to.
#     teamviz.example.com must resolve to the Apache host (A or CNAME record).
#     Kerberos is hostname-sensitive — mismatched names cause silent failures.
#
#  4. Browser SPNEGO configuration
#
#     Firefox:
#       about:config → network.negotiate-auth.trusted-uris = teamviz.example.com
#       about:config → network.negotiate-auth.delegation-uris = teamviz.example.com
#
#     Chrome / Edge (managed environments):
#       GPO: Computer Config → Policies → Admin Templates → Google Chrome →
#            "AuthServerAllowlist" = "teamviz.example.com"
#       Or launch flag: --auth-server-whitelist="*teamviz.example.com"
#
#     Internet Explorer / Edge (legacy):
#       Internet Options → Security → Local Intranet → add https://teamviz.example.com
#       Ensure "Automatic logon with current user name and password" is enabled.
#
#  5. Apache modules to install
#
#     RHEL/CentOS:   dnf install mod_auth_gssapi mod_lua
#     Debian/Ubuntu: apt install libapache2-mod-auth-gssapi apache2-utils
#                    a2enmod lua auth_gssapi ldap authnz_ldap headers rewrite proxy proxy_http
#     Alpine:        apk add apache-mod_auth_gssapi apache-mod_lua openldap-clients
#
#     The Lua script also needs ldapsearch (openldap-clients / ldap-utils package).
#
#  6. LDAP bind account
#
#     Create a read-only service account in AD/LDAP for group lookups:
#       CN=svc-apache-teamviz,OU=Service Accounts,DC=example,DC=com
#     This account only needs "read" permission on user/group objects.
#
# ============================================================
# Configuration
# ============================================================

<VirtualHost *:80>
    ServerName teamviz.example.com

    # --- WebSocket support for /api/ws ---
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://teamviz:8080/$1" [P,L]

    # --- Kerberos (SPNEGO) authentication ---
    <Location />
        AuthType GSSAPI
        AuthName "Kerberos Login"
        GssapiCredStore keytab:/etc/httpd/teamviz.keytab
        # Strip the @REALM suffix: "jdoe@EXAMPLE.COM" → "jdoe"
        GssapiStripRoot On
        # Map the Kerberos principal to a local username
        GssapiLocalName On
        # Allow browsers without Kerberos config to fall back to
        # username/password (Basic auth prompt). Comment out to
        # require Kerberos-only (no fallback).
        GssapiBasicAuth On
        GssapiBasicAuthMechanism krb5
        Require valid-user
    </Location>

    # --- LDAP group → role mapping (mod_lua) ---
    #
    # After Kerberos auth, REMOTE_USER is set. The Lua hook queries
    # LDAP for the user's group memberships, maps them to the app's
    # group names (tvz-admin, tvz-normal, tvz-readonly), and injects
    # the result as X-Dev-Groups.
    #
    # The Lua script reads its LDAP config from environment variables
    # set below. Adjust these for your directory.
    <IfModule mod_lua.c>
        # LDAP connection parameters (read by group_lookup.lua)
        SetEnv TVZ_LDAP_URL       "ldap://dc1.example.com:389"
        SetEnv TVZ_LDAP_BIND_DN    "cn=svc-apache-teamviz,ou=Service Accounts,dc=example,dc=com"
        SetEnv TVZ_LDAP_BIND_PW   "bind-password-here"
        SetEnv TVZ_LDAP_BASE_DN    "dc=example,dc=com"
        # User attribute that matches the Kerberos username (after GssapiStripRoot)
        SetEnv TVZ_LDAP_USER_ATTR  "sAMAccountName"
        # Group DNs to detect (pipe-separated). The script checks if the
        # user's memberOf contains any of these. Map them to the group
        # names the app expects (set via TVZ_ADMIN_GROUP etc.).
        # Format: app-group-name=LDAP-group-DN
        SetEnv TVZ_LDAP_GROUP_MAP  "tvz-admin=CN=tvz-admin,OU=Groups,DC=example,DC=com|tvz-normal=CN=tvz-normal,OU=Groups,DC=example,DC=com|tvz-readonly=CN=tvz-readonly,OU=Groups,DC=example,DC=com"
        # Cache TTL in seconds (ldapsearch is called at most once per TTL per user)
        SetEnv TVZ_LDAP_CACHE_TTL  "60"

        LuaHookFixups group_lookup /etc/httpd/lua/group_lookup.lua
    </IfModule>

    # --- Fallback: no mod_lua (all users get a fixed role) ---
    #
    # If mod_lua is not available, uncomment these two lines to give
    # all authenticated users a fixed role. Everyone gets "readonly"
    # unless you change the value. Use this only for simple deployments
    # where you don't need per-user role mapping.
    #
    # RequestHeader set X-Dev-User  "%{REMOTE_USER}e"
    # RequestHeader set X-Dev-Groups "tvz-readonly"

    # --- Regular HTTP proxy ---
    ProxyPreserveHost On
    ProxyPass / http://teamviz:8080/
    ProxyPassReverse / http://teamviz:8080/

    # --- Optional TLS (uncomment for production) ---
    # SSLEngine on
    # SSLCertificateFile /etc/httpd/ssl/teamviz.crt
    # SSLCertificateKeyFile /etc/httpd/ssl/teamviz.key
    # SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    # SSLCipherSuite HIGH:!aNULL:!MD5
    # RequestHeader set X-Forwarded-Proto https
</VirtualHost>