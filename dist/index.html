<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Activity Visualizer</title>
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;font-size:14px;line-height:1.4;--font-mono:'SF Mono','Fira Code','Cascadia Code',monospace}
body{background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
a{color:var(--accent)}button{cursor:pointer;font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--fg);padding:4px 12px;border-radius:4px;transition:background .15s}button:hover{background:var(--surface-hover)}button:active{background:var(--surface-active)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.primary:hover{filter:brightness(1.1)}button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}input,select,textarea{font:inherit;border:1px solid var(--border);background:var(--input-bg);color:var(--fg);padding:4px 8px;border-radius:4px;width:100%}input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
h1{font-size:1.5rem;font-weight:700}h2{font-size:1.2rem;font-weight:600}h3{font-size:1rem;font-weight:600}
/* ===== LAYOUT ===== */
#app{display:flex;flex-direction:column;min-height:100vh}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:100}
#topbar .logo{font-weight:700;font-size:1.1rem;margin-right:8px}
#topbar .nav-btn{padding:4px 10px;font-size:.85rem}
#topbar .nav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#topbar .spacer{flex:1}
#topbar .topbar-right{display:flex;align-items:center;gap:6px}
#main{flex:1;padding:12px 16px;overflow-x:auto}
#statusbar{padding:4px 16px;font-size:.8rem;color:var(--fg-muted);border-top:1px solid var(--border);background:var(--surface);display:flex;justify-content:space-between}
/* ===== OVERLAY / MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center}
.overlay.hidden{display:none}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.modal h2{margin-bottom:12px}
.modal .form-row{margin-bottom:10px}
.modal .form-row label{display:block;font-size:.85rem;color:var(--fg-muted);margin-bottom:2px}
.modal .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* ===== ONBOARDING ===== */
#onboarding{text-align:center;padding:60px 20px;max-width:600px;margin:0 auto}
#onboarding h1{margin-bottom:16px}
#onboarding p{margin-bottom:12px;color:var(--fg-muted)}
#onboarding .actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
/* ===== TEAM GRID ===== */
.grid-container{overflow-x:auto}
.grid-table{border-collapse:collapse;width:100%;min-width:600px}
.grid-table th,.grid-table td{border:1px solid var(--border);padding:2px;text-align:center;vertical-align:middle;font-size:.75rem}
.grid-table th{background:var(--surface);position:sticky;top:0;z-index:2;font-weight:600;padding:4px 6px}
.grid-table th.person-col{text-align:left;min-width:120px;position:sticky;left:0;z-index:3;background:var(--surface)}
.grid-table td.person-col{text-align:left;min-width:120px;position:sticky;left:0;z-index:1;background:var(--bg);font-weight:500;cursor:pointer}
.grid-table td.person-col:hover{color:var(--accent)}
.grid-table .day-header{font-size:.7rem;white-space:nowrap}.grid-table .week-header{font-size:.7rem;white-space:nowrap}
.grid-table .half-day{min-width:44px;height:22px;border-radius:2px;cursor:pointer;position:relative;flex-shrink:0;overflow:hidden;font-size:7px;line-height:1;text-align:center;user-select:none}
.grid-table .half-day:hover{outline:2px solid var(--accent);outline-offset:-1px;z-index:1}
.grid-table .half-day .cell-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-table .half-day.not-filled{background:var(--slot-empty);border:1px dashed var(--border)}
.grid-table .half-day.not-filled .cell-label{color:var(--fg-muted);opacity:.5;font-size:8px}
.grid-table .half-day.undetermined{background:var(--slot-undetermined);background-image:repeating-linear-gradient(45deg,transparent,transparent 2px,var(--slot-undetermined-line) 2px,var(--slot-undetermined-line) 4px)}
.grid-table .half-day.away{background:var(--slot-away)}
.grid-table .half-day.away .cell-label{color:#fff;opacity:.9}
.grid-table .half-day.project{background:var(--slot-project)}
.grid-table .half-day.project .cell-label{color:#fff;opacity:.9}
.grid-table .half-day.run{background:var(--slot-run)}
.grid-table .half-day.run .cell-label{color:#fff;opacity:.9}
.grid-table .half-day.project.run{background:linear-gradient(135deg,var(--slot-project) 50%,var(--slot-run) 50%)}
.grid-table .half-day.project.run .cell-label{color:#fff;opacity:.9}
.grid-table td.week-start,.grid-table th.week-start{border-left:3px solid var(--accent)!important}
.grid-table .half-day.selected{outline:2px solid var(--accent);outline-offset:0;z-index:5;opacity:.6}
.grid-table .half-day.in-range{outline:1px solid var(--accent);outline-offset:0;z-index:4}
.grid-table .half-day.merged-start{border-radius:3px 0 0 3px}
.grid-table .half-day.merged-cont{border-left-color:transparent;border-radius:0}
.grid-table .half-day.merged-end{border-radius:0 3px 3px 0}
.grid-table .summary-row td{font-size:.7rem;padding:4px 6px}
.grid-table .subteam-row td{background:var(--surface-hover);font-weight:700;font-size:.75rem;padding:4px 8px;text-align:left;border-bottom:2px solid var(--accent)}
.grid-table td.on-call{box-shadow:inset 0 2px 0 0 var(--accent),inset 0 -2px 0 0 var(--accent)}
.oncall-btn{display:inline-flex;align-items:center;gap:2px;font-size:.7rem;padding:1px 4px;border-radius:3px;cursor:pointer;margin-left:4px;vertical-align:middle}
.oncall-btn.active{background:var(--accent);color:#fff;font-weight:700}
/* ===== PROJECTS ===== */
.project-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px}
.project-card .proj-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.project-card .proj-header .proj-emoji{font-size:1.3rem}
.project-card .proj-header .proj-name{font-weight:700;font-size:1rem}
.project-card .proj-desc{font-size:.85rem;color:var(--fg-muted);margin-bottom:6px}
.project-card .proj-meta{font-size:.8rem;color:var(--fg-muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.project-card .proj-people{font-size:.8rem;margin-top:6px;color:var(--fg-muted)}
.status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:600;color:#fff}
.gantt-container{overflow-x:auto;margin-top:12px}
.gantt-table{border-collapse:collapse;width:100%;min-width:600px}
.gantt-table th,.gantt-table td{border:1px solid var(--border);padding:3px;font-size:.75rem;text-align:center}
.gantt-table th{background:var(--surface);position:sticky;top:0}
.gantt-row{height:28px}
.gantt-bar{height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;overflow:hidden;white-space:nowrap;position:relative;cursor:pointer}
.gantt-bar:hover{outline:2px solid var(--accent);outline-offset:1px}
.gantt-now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:5;pointer-events:none}
.gantt-bar.no-people{border:2px dashed var(--danger)}
.gantt-bar.status-unstarted{opacity:.5}
.gantt-bar.status-paused{opacity:.6;background:#ff9800}
.gantt-bar.status-done{opacity:.4}
.grid-table .summary-row .bar{display:inline-block;height:8px;border-radius:4px;margin:0 2px}
/* ===== INDIVIDUAL VIEW ===== */
.indiv-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.indiv-header .person-info{display:flex;align-items:center;gap:8px}
.indiv-header .person-info .avatar{font-size:1.5rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.indiv-grid{width:100%}
.indiv-grid td{padding:4px 8px;border:1px solid var(--border);font-size:.8rem}
.indiv-grid .slot-cell{min-width:80px;padding:6px 8px;border-radius:4px;text-align:center;font-size:.75rem}
.indiv-grid .slot-cell.away{background:var(--slot-away);color:#fff}
.indiv-grid .slot-cell.project{background:var(--slot-project);color:#fff}
.indiv-grid .slot-cell.run{background:var(--slot-run);color:#fff}
.indiv-grid .slot-cell.project.run{background:linear-gradient(135deg,var(--slot-project) 50%,var(--slot-run) 50%);color:#fff}
.indiv-grid .slot-cell.undetermined{background:var(--slot-undetermined);background-image:repeating-linear-gradient(45deg,transparent,transparent 2px,var(--slot-undetermined-line) 2px,var(--slot-undetermined-line) 4px)}
.indiv-grid .slot-cell.not-filled{background:var(--slot-empty);border:1px dashed var(--border);color:var(--fg-muted)}
/* ===== RUN COVERAGE ===== */
.run-view .week-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px}
.run-view .week-card .week-title{font-weight:600;margin-bottom:6px}
.run-view .week-card .bar-track{height:20px;background:var(--input-bg);border-radius:10px;overflow:hidden;margin:4px 0;position:relative}
.run-view .week-card .bar-fill{height:100%;border-radius:10px;transition:width .3s;min-width:4px}
.run-view .week-card .bar-fill.green{background:#4caf50}
.run-view .week-card .bar-fill.amber{background:#ff9800}
.run-view .week-card .bar-fill.red{background:#f44336}
.run-view .week-card .bar-label{font-size:.8rem;color:var(--fg-muted)}
.run-view .slot-coverage{display:flex;align-items:center;gap:4px;font-size:.75rem;padding:2px 6px;border-radius:3px}
.run-view .slot-coverage.met{background:rgba(76,175,80,.2);color:#4caf50}
.run-view .slot-coverage.below{background:rgba(244,67,54,.2);color:var(--danger);font-weight:600}
.run-view .slot-coverage-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:.75rem}
.run-view .slot-coverage-table th,.run-view .slot-coverage-table td{border:1px solid var(--border);padding:3px 6px;text-align:center}
.run-view .slot-coverage-table th{background:var(--surface)}
.run-view .slot-coverage-table td.below{background:rgba(244,67,54,.15);color:var(--danger);font-weight:600}
.run-view .slot-coverage-table td.met{background:rgba(76,175,80,.15)}
.run-view .warning-banner{background:rgba(244,67,54,.15);border:1px solid var(--danger);border-radius:4px;padding:6px 10px;margin-top:6px;color:var(--danger);font-weight:600;font-size:.85rem}
/* ===== AVAILABILITY ===== */
.avail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.avail-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px}
.avail-card .name{font-weight:600;margin-bottom:4px}
.avail-card .status{font-size:.8rem;padding:2px 6px;border-radius:3px;display:inline-block}
.avail-card .status.away{background:var(--slot-away);color:#fff}
.avail-card .status.run{background:var(--slot-run);color:#fff}
.avail-card .status.project{background:var(--slot-project);color:#fff}
.avail-card .status.available{background:var(--accent);color:#fff}
/* ===== PEOPLE LIST ===== */
.people-list{display:grid;gap:8px}
.people-list .person-card{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px}
.people-list .person-card .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.people-list .person-card .info{flex:1}
.people-list .person-card .info .name{font-weight:600}
.people-list .person-card .info .meta{font-size:.8rem;color:var(--fg-muted)}
.people-list .person-card .actions{display:flex;gap:4px}
.hidden{display:none!important}
/* ===== CELL EDITOR ===== */
.cell-editor{position:fixed;z-index:150;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;box-shadow:0 4px 24px rgba(0,0,0,.3);min-width:280px;max-width:400px}
.cell-editor .tabs{display:flex;gap:4px;margin-bottom:10px}
.cell-editor .tabs button{flex:1;padding:4px 8px;font-size:.8rem}
.cell-editor .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cell-editor .tab-content{min-height:100px}
.cell-editor .tab-content.hidden{display:none}
.cell-editor .project-row{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.cell-editor .project-row input[type=text]{flex:1}
.cell-editor .project-row input[type=number]{width:60px}
.cell-editor .project-row button{padding:2px 6px;font-size:.75rem}
.cell-editor .pct-total{font-size:.8rem;color:var(--fg-muted);margin-top:4px}
.cell-editor .pct-total.over{color:var(--danger);font-weight:600}
.cell-editor .form-actions{margin-top:10px;display:flex;gap:6px;justify-content:flex-end}
/* ===== SETTINGS ===== */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:500px}
.settings-grid .field label{display:block;font-size:.8rem;color:var(--fg-muted);margin-bottom:2px}
/* ===== HELP PANEL ===== */
.help-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:.85rem}
.help-shortcuts kbd{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-family:var(--font-mono);font-size:.75rem}
/* ===== PRINT ===== */
@media print{body{--bg:#fff;--fg:#000;--border:#ccc;--surface:#f5f5f5;--fg-muted:#666}#topbar,#statusbar,.cell-editor,.overlay,.nav-btn,.print-hide{display:none!important}#main{padding:0}.grid-table th.person-col,.grid-table td.person-col{position:static}.grid-table .half-day.not-filled::after{content:''}}
/* ===== THEMES ===== */
/* Light (default) */
:root,[data-theme=light]{--bg:#f8f9fa;--fg:#212529;--fg-muted:#6c757d;--border:#dee2e6;--surface:#fff;--surface-hover:#e9ecef;--surface-active:#dee2e6;--input-bg:#fff;--accent:#4361ee;--danger:#e63946;--slot-empty:#f0f0f0;--slot-undetermined:#d4d4d4;--slot-undetermined-line:#b0b0b0;--slot-away:#e07b00;--slot-project:#4361ee;--slot-run:#e63946}
/* Dracula */
[data-theme=dracula]{--bg:#282a36;--fg:#f8f8f2;--fg-muted:#6272a4;--border:#44475a;--surface:#363849;--surface-hover:#44475a;--surface-active:#555770;--input-bg:#1e1f29;--accent:#bd93f9;--danger:#ff5555;--slot-empty:#3a3c4a;--slot-undetermined:#4a4c5a;--slot-undetermined-line:#6272a4;--slot-away:#ffb86c;--slot-project:#8be9fd;--slot-run:#ff5555}
/* Monokai */
[data-theme=monokai]{--bg:#272822;--fg:#f8f8f2;--fg-muted:#75715e;--border:#49483e;--surface:#3e3d32;--surface-hover:#49483e;--surface-active:#5a594e;--input-bg:#1d1e19;--accent:#a6e22e;--danger:#f92672;--slot-empty:#3a3b30;--slot-undetermined:#4a4b40;--slot-undetermined-line:#75715e;--slot-away:#fd971f;--slot-project:#66d9ef;--slot-run:#f92672}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="logo">📊 Team Visualizer</span>
    <button class="nav-btn active" data-view="team">Team Grid</button>
    <button class="nav-btn" data-view="availability">Availability</button>
    <button class="nav-btn" data-view="run">Run Coverage</button>
    <button class="nav-btn" data-view="guests">Guests</button>
    <button class="nav-btn" data-view="archived">Archived</button>
    <button class="nav-btn" data-view="people">People</button>
    <button class="nav-btn" data-view="projects">Projects</button>
    <button class="nav-btn" data-view="settings">Settings</button>
    <span class="spacer"></span>
    <span class="topbar-right">
      <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>↩ Undo</button>
      <button id="btn-export" title="Export TOML (Ctrl+E)">⬇ Export</button>
      <button id="btn-import" title="Import TOML">⬆ Import</button>
      <button id="btn-help" title="Help">❓</button>
    </span>
  </div>
  <div id="main"></div>
  <div id="statusbar">
    <span id="status-left"></span>
    <span id="status-right"></span>
  </div>
</div>

<!-- Overlay for modals -->
<div id="overlay" class="overlay hidden"><div id="modal-content" class="modal"></div></div>

<!-- Cell editor -->
<div id="cell-editor" class="cell-editor hidden"></div>

<script>
/* ===================================================================
   TEAM ACTIVITY VISUALIZER — V1
   Single-file self-contained HTML5 application
   =================================================================== */

// ===== UTILITY FUNCTIONS =====
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const uid = () => Math.random().toString(36).substr(2,9) + Date.now().toString(36);
const pad2 = n => String(n).padStart(2,'0');
const fmtDate = d => `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}`;
const parseDate = s => { const m = s.match(/^(\d{4})\/(\d{2})\/(\d{2})$/); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; };
const fmtDateTime = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`;
const fmtExportTS = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}-${pad2(d.getHours())}-${pad2(d.getMinutes())}`;
const daysSince = (d1,d2) => Math.round((d2-d1)/(86400000));
const clone = o => JSON.parse(JSON.stringify(o));
const sum = arr => arr.reduce((a,b)=>a+b,0);
const escapeHtml = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

// Date picker helper: convert native date input (YYYY-MM-DD) to text input (YYYY/MM/DD)
function datePickerToText(picker, textId) {
  if (picker.value) {
    document.getElementById(textId).value = picker.value.replace(/-/g, '/');
  }
}

// Generate a <datalist> of all project names for autocomplete
function projectNamesDatalist() {
  const names = store.projects.filter(p => p.status !== 'done').map(p => p.name).filter(Boolean);
  return '<datalist id="project-names">' + names.map(n => `<option value="${escapeHtml(n)}">`).join('') + '</datalist>';
}

// Project color hashing — same project name = same color across people
function projectColor(name) {
  if (!name) return null;
  let h = 0;
  for (let i = 0; i < name.length; i++) h = ((h<<5)-h+name.charCodeAt(i))|0;
  const hue = Math.abs(h) % 360;
  const sat = 55 + (Math.abs(h>>8) % 20); // 55-75%
  const light = 45 + (Math.abs(h>>16) % 10); // 45-55%
  return `hsl(${hue},${sat}%,${light}%)`;
}
function projectColorBg(slotData) {
  if (!slotData || !slotData.projects || slotData.projects.length === 0) return null;
  if (slotData.projects.length === 1 && !slotData.run) return projectColor(slotData.projects[0].name);
  if (slotData.projects.length === 1 && slotData.run) return projectColor(slotData.projects[0].name);
  // Multi-project: gradient of first two
  if (slotData.projects.length >= 2) {
    const c1 = projectColor(slotData.projects[0].name);
    const c2 = projectColor(slotData.projects[1].name);
    return `linear-gradient(135deg,${c1} 50%,${c2} 50%)`;
  }
  return null;
}

// Week helpers: Monday-start weeks
function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day; // Monday = 1
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function addWeeks(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n * 7);
  return d;
}
function formatWeekStart(d) {
  return fmtDate(d);
}
function getWeekDays(weekStart) {
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  return days;
}
function getWeekNumber(d) {
  const start = getWeekStart(d);
  const yearStart = new Date(start.getFullYear(), 0, 1);
  return Math.ceil(((start - yearStart) / 86400000 + yearStart.getDay() + 1) / 7);
}

// ===== STORE =====
const STORE_KEY = 'teamviz_data';
let store = null;
let undoStack = null; // single-level undo

const defaultSettings = {
  window_weeks: 4,
  prune_weeks: 12,
  week_starts: 'monday',
  run_mode: 'ratio',
  run_target_persons: 3,
  theme: 'dracula',
  export_counter: 1
};

function initStore() {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) {
    try {
      store = JSON.parse(raw);
      migrateStore();
      return true;
    } catch(e) { console.error('Store parse error', e); }
  }
  store = {
    schema_version: 1,
    settings: clone(defaultSettings),
    people: [],
    planning: {},
    rotation: {},
    oncall: {},
    projects: []
  };
  saveStore();
  return false;
}

function migrateStore() {
  if (!store.schema_version || store.schema_version < 1) {
    // Future migrations go here
    store.schema_version = 1;
  }
  // Ensure all fields exist
  if (!store.settings) store.settings = clone(defaultSettings);
  Object.keys(defaultSettings).forEach(k => {
    if (store.settings[k] === undefined) store.settings[k] = defaultSettings[k];
  });
  // Migrate old run ratio target to new person-count target
  if (store.settings.default_run_ratio_target !== undefined && store.settings.run_target_persons === undefined) {
    // Convert old percentage to approximate person count (20% of 20 people ≈ 4, but we default to 3)
    store.settings.run_target_persons = 3;
  }
  delete store.settings.default_run_ratio_target;
  if (!store.people) store.people = [];
  if (!store.planning) store.planning = {};
  if (!store.rotation) store.rotation = {};
  if (!store.oncall) store.oncall = {};
  if (!store.projects) store.projects = [];
  saveStore();
}

function saveStore() {
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
  updateStatusBar();
}

function pushUndo() {
  undoStack = clone(store);
  document.getElementById('btn-undo').disabled = false;
}

function undo() {
  if (!undoStack) return;
  store = undoStack;
  undoStack = null;
  document.getElementById('btn-undo').disabled = true;
  saveStore();
  render();
}

// Assign run person: set rotation flag AND fill the week's schedule with RUN
function assignRunPerson(personId, weekStart) {
  const p = getPerson(personId);
  const name = p ? p.name : 'This person';
  const weekStartObj = parseDate(weekStart);
  if (!weekStartObj) return false;
  const days = getWeekDays(weekStartObj);
  
  // Count existing filled slots
  let filledCount = 0;
  days.forEach((d, di) => {
    if (di >= 5 && !showWeekend) return;
    const ds = fmtDate(d);
    ['am','pm'].forEach(slot => {
      const sd = store.planning[getSlotKey(personId, ds, slot)];
      if (sd && sd.state !== 'not_filled') filledCount++;
    });
  });
  
  // Warn if data exists
  if (filledCount > 0) {
    if (!confirm(`${name} already has ${filledCount} filled half-day slot(s) for this week. Overwrite all with RUN duty?`)) {
      return false;
    }
  }
  
  pushUndo();
  // Set rotation flag
  store.rotation[`${personId}|${weekStart}`] = true;
  // Fill all working half-days with RUN
  days.forEach((d, di) => {
    if (di >= 5 && !showWeekend) return;
    const ds = fmtDate(d);
    ['am','pm'].forEach(slot => {
      store.planning[getSlotKey(personId, ds, slot)] = { state: 'filled', away: null, projects: [], run: true };
    });
  });
  saveStore();
  return true;
}

function isRunPerson(personId, weekStart) {
  return !!store.rotation[`${personId}|${weekStart}`];
}

function getRunPeople(weekStart) {

// ===== RUN COVERAGE CALCULATIONS (headcount model) =====
// Count people on run per half-day slot, compare to run_target_persons
function calcRunRatio(personId, weekStart) {
  const p = getPerson(personId);
  if (!p) return { working: 0, run: 0, ratio: 0, target: 0 };
  const days = getWeekDays(parseDate(weekStart));
  let working = 0, run = 0;
  days.forEach(d => {
    const ds = fmtDate(d);
    ['am','pm'].forEach(slot => {
      const key = getSlotKey(personId, ds, slot);
      const slotData = store.planning[key];
      if (!slotData || slotData.state === 'not_filled') {
        working++;
      } else if (slotData.state === 'undetermined') {
        working++;
      } else if (slotData.away) {
        // away = not working
      } else {
        working++;
        if (slotData.run) run++;
      }
    });
  });
  return { working, run, ratio: working > 0 ? (run / working) * 100 : 0 };
}

// Per-half-day run headcount for a week
function calcRunCoveragePerSlot(weekStart) {
  const people = getActivePeople();
  const days = getWeekDays(parseDate(weekStart));
  const result = []; // [{day, dayName, am: {onRun, away, avail}, pm: {...}}]
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  days.forEach((d, di) => {
    if (di >= 5 && !showWeekend) return;
    const ds = fmtDate(d);
    const dayResult = { dayName: dayNames[di], date: ds, am: { onRun: 0, away: 0, avail: 0 }, pm: { onRun: 0, away: 0, avail: 0 } };
    ['am','pm'].forEach(slot => {
      people.forEach(p => {
        const key = getSlotKey(p.id, ds, slot);
        const sd = store.planning[key];
        if (!sd || sd.state === 'not_filled' || sd.state === 'undetermined') dayResult[slot].avail++;
        else if (sd.away) dayResult[slot].away++;
        else { dayResult[slot].avail++; if (sd.run) dayResult[slot].onRun++; }
      });
    });
    result.push(dayResult);
  });
  return result;
}

function calcTeamRunRatio(weekStart) {
  const people = getActivePeople();
  let totalWorking = 0, totalRun = 0;
  people.forEach(p => {
    const r = calcRunRatio(p.id, weekStart);
    totalWorking += r.working;
    totalRun += r.run;
  });
  const halfDaysPerWeek = 10;
  return {
    totalWorking, totalRun,
    ratio: totalWorking > 0 ? (totalRun / totalWorking) * 100 : 0,
    avgCollaborators: halfDaysPerWeek > 0 ? totalRun / halfDaysPerWeek : 0,
    personCount: people.length
  };
}

// ===== TOML PARSER (minimal) =====
// Strip TOML comments (# ...) but only outside quoted strings
function stripComment(line) {
  let inStr = false, strCh = '';
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inStr) {
      if (c === strCh && line[i-1] !== '\\') inStr = false;
      continue;
    }
    if (c === '"' || c === "'") { inStr = true; strCh = c; continue; }
    if (c === '#') return line.substring(0, i).trim();
  }
  return line.trim();
}

// Handles the subset needed for our schema
function parseTOML(text) {
  const result = {};
  let currentTable = result;
  let currentArrayTable = null;
  let arrayTableName = null;
  
  const lines = text.split('\n');
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    // Remove comments (only outside quoted strings)
    line = stripComment(line);
    if (!line) continue;
    
    // Array of tables [[...]]
    const arrMatch = line.match(/^\[\[(.+)\]\]$/);
    if (arrMatch) {
      arrayTableName = arrMatch[1].trim();
      if (!result[arrayTableName]) result[arrayTableName] = [];
      const newObj = {};
      result[arrayTableName].push(newObj);
      currentArrayTable = newObj;
      currentTable = newObj;
      continue;
    }
    
    // Table [...]
    const tableMatch = line.match(/^\[(.+)\]$/);
    if (tableMatch) {
      arrayTableName = null;
      const name = tableMatch[1].trim();
      let parts = name.split('.').map(s => s.trim());
      let obj = result;
      parts.forEach(p => {
        if (!obj[p]) obj[p] = {};
        obj = obj[p];
      });
      currentTable = obj;
      continue;
    }
    
    // Key = Value
    const kvMatch = line.match(/^([^=]+)=\s*(.+)$/);
    if (kvMatch) {
      const key = kvMatch[1].trim();
      let val = kvMatch[2].trim();
      // Handle multi-line arrays/tables: if value starts with [ or { but doesn't close, keep reading
      while ((val.startsWith('[') || val.startsWith('{')) && !isBalanced(val)) {
        i++;
        if (i >= lines.length) break;
        let nextLine = stripComment(lines[i].trim());
        val += ' ' + nextLine;
      }
      const target = currentArrayTable || currentTable;
      target[key] = parseTOMLValue(val);
    }
  }
  return result;
}

// Check if brackets/braces are balanced (ignoring strings)
function isBalanced(str) {
  let depth = 0, inStr = false, strCh = '';
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (inStr) {
      if (c === strCh && str[i-1] !== '\\') inStr = false;
      continue;
    }
    if (c === '"' || c === "'") { inStr = true; strCh = c; continue; }
    if (c === '[' || c === '{') depth++;
    else if (c === ']' || c === '}') depth--;
  }
  return depth === 0;
}

function parseTOMLValue(val) {
  val = val.trim();
  // String (quoted)
  if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
    return val.slice(1, -1);
  }
  // Boolean
  if (val === 'true') return true;
  if (val === 'false') return false;
  // Number
  if (/^-?\d+(\.\d+)?$/.test(val)) {
    return val.includes('.') ? parseFloat(val) : parseInt(val, 10);
  }
  // Inline table { ... } — parse with brace-awareness
  if (val.startsWith('{') && val.endsWith('}')) {
    return parseInlineTable(val);
  }
  // Array [ ... ] — parse with bracket-awareness
  if (val.startsWith('[') && val.endsWith(']')) {
    return parseArrayValue(val);
  }
  // Date/Time
  if (/^\d{4}-\d{2}-\d{2}/.test(val)) {
    return val; // keep as string
  }
  return val;
}

// Parse inline table respecting nested braces
function parseInlineTable(val) {
  const inner = val.slice(1, -1).trim();
  if (!inner) return {};
  const obj = {};
  const pairs = splitTopLevel(inner, ',');
  pairs.forEach(pair => {
    const eqIdx = pair.indexOf('=');
    if (eqIdx < 0) return;
    const k = pair.substring(0, eqIdx).trim();
    const v = pair.substring(eqIdx + 1).trim();
    if (k && v) obj[k] = parseTOMLValue(v);
  });
  return obj;
}

// Parse array respecting nested brackets/braces
function parseArrayValue(val) {
  const inner = val.slice(1, -1).trim();
  if (!inner) return [];
  const items = splitTopLevel(inner, ',');
  return items.map(s => parseTOMLValue(s.trim())).filter(v => v !== '');
}

// Split on delimiter at top level (not inside brackets/braces/quotes)
function splitTopLevel(str, delim) {
  const parts = [];
  let depth = 0, inStr = false, strCh = '';
  let start = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (inStr) {
      if (c === strCh && str[i-1] !== '\\') inStr = false;
      continue;
    }
    if (c === '"' || c === "'") { inStr = true; strCh = c; continue; }
    if (c === '{' || c === '[') depth++;
    else if (c === '}' || c === ']') depth--;
    else if (c === delim && depth === 0) {
      parts.push(str.substring(start, i).trim());
      start = i + 1;
    }
  }
  if (start < str.length) parts.push(str.substring(start).trim());
  return parts.filter(p => p);
}

// ===== TOML SERIALIZER =====
function serializeTOML(obj, indent) {
  indent = indent || '';
  let out = '';
  
  if (Array.isArray(obj)) {
    obj.forEach(item => {
      if (typeof item === 'object' && item !== null) {
        out += serializeTOMLObject(item, indent);
      } else {
        out += indent + serializeTOMLValue(item) + '\n';
      }
    });
  } else if (typeof obj === 'object' && obj !== null) {
    out += serializeTOMLObject(obj, indent);
  }
  return out;
}

function serializeTOMLObject(obj, indent) {
  let out = '';
  const keys = Object.keys(obj);
  
  // Simple key-value pairs first
  keys.forEach(k => {
    const v = obj[k];
    if (v === null || v === undefined) return;
    if (Array.isArray(v) && v.length > 0 && typeof v[0] === 'object') {
      // Array of tables - handled later
      return;
    }
    if (typeof v === 'object') {
      // Inline table or nested - handled later
      return;
    }
    out += indent + k + ' = ' + serializeTOMLValue(v) + '\n';
  });
  
  // Inline objects
  keys.forEach(k => {
    const v = obj[k];
    if (v === null || v === undefined) return;
    if (typeof v === 'object' && !Array.isArray(v)) {
      out += indent + k + ' = ' + serializeInlineTable(v) + '\n';
    }
  });
  
  // Arrays of tables
  keys.forEach(k => {
    const v = obj[k];
    if (Array.isArray(v) && v.length > 0 && typeof v[0] === 'object') {
      v.forEach(item => {
        out += '\n' + indent + '[[' + k + ']]\n';
        out += serializeTOMLObject(item, indent);
      });
    }
  });
  
  return out;
}

function serializeTOMLValue(v) {
  if (typeof v === 'string') return '"' + v.replace(/"/g, '\\"') + '"';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number') return String(v);
  if (Array.isArray(v)) return '[' + v.map(serializeTOMLValue).join(', ') + ']';
  if (typeof v === 'object') return serializeInlineTable(v);
  return String(v);
}

function serializeInlineTable(obj) {
  const entries = Object.keys(obj).map(k => k + ' = ' + serializeTOMLValue(obj[k]));
  return '{ ' + entries.join(', ') + ' }';
}

// ===== ICS GENERATOR =====
function generateICS(personId, startDate, endDate) {
  const p = getPerson(personId);
  if (!p) return '';
  const start = parseDate(startDate);
  const end = parseDate(endDate);
  if (!start || !end) return '';
  
  let events = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const ds = fmtDate(d);
    ['am','pm'].forEach((slot, si) => {
      const key = getSlotKey(personId, ds, slot);
      const slotData = store.planning[key];
      if (!slotData || slotData.state === 'not_filled') return;
      
      const hourStart = si === 0 ? 9 : 14;
      const dtStart = new Date(d);
      dtStart.setHours(hourStart, 0, 0, 0);
      const dtEnd = new Date(d);
      dtEnd.setHours(hourStart + 4, 0, 0, 0);
      
      if (slotData.state === 'undetermined') {
        events.push(makeEvent(dtStart, dtEnd, 'Project: undetermined', 'Undetermined project', 'undetermined'));
        return;
      }
      
      if (slotData.away) {
        const label = slotData.away.note ? `${slotData.away.type}: ${slotData.away.note}` : `Away: ${slotData.away.type}`;
        events.push(makeEvent(dtStart, dtEnd, label, `Away - ${slotData.away.type}`, slotData.away.type));
        return;
      }
      
      if (slotData.projects && slotData.projects.length > 0) {
        slotData.projects.forEach(proj => {
          const desc = `Project: ${proj.name} (${proj.pct}%)` + (slotData.run ? ' + Run duty' : '');
          const title = `Project: ${proj.name}`;
          events.push(makeEvent(dtStart, dtEnd, title, desc, 'project'));
        });
      } else if (slotData.run) {
        events.push(makeEvent(dtStart, dtEnd, 'Run duty', 'Run duty', 'run'));
      }
    });
  }
  
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//TeamVisualizer//V1//EN\r\n';
  events.forEach(e => { ics += e; });
  ics += 'END:VCALENDAR\r\n';
  return ics;
}

function makeEvent(dtStart, dtEnd, summary, description, category) {
  const uidVal = uid() + '@teamviz';
  const fmt = d => {
    const y = d.getFullYear();
    const m = pad2(d.getMonth()+1);
    const dd = pad2(d.getDate());
    const h = pad2(d.getHours());
    const min = pad2(d.getMinutes());
    return `${y}${m}${dd}T${h}${min}00`;
  };
  const now = new Date();
  const dtstamp = fmt(now) + 'Z';
  const esc = s => String(s||'').replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');
  return [
    'BEGIN:VEVENT',
    'UID:' + uidVal,
    'DTSTAMP:' + dtstamp,
    'DTSTART:' + fmt(dtStart),
    'DTEND:' + fmt(dtEnd),
    'SUMMARY:' + esc(summary),
    'DESCRIPTION:' + esc(description),
    'CATEGORIES:' + esc(category),
    'END:VEVENT\r\n'
  ].join('\r\n');
}

function getVisibleWeeks() {
  const n = store.settings.window_weeks || 4;
  const now = new Date();
  const currentWeekStart = getWeekStart(now);
  const weeks = [];
  for (let i = 0; i < n; i++) {
    weeks.push(addWeeks(currentWeekStart, i + scrollOffset));
  }
  return weeks;
}

// ===== RENDER ENGINE =====
function render() {
  const main = document.getElementById('main');
  const view = currentView;
  
  // Update nav buttons
  $$('.nav-btn[data-view]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === view);
  });
  
  // Apply theme
  document.documentElement.setAttribute('data-theme', store.settings.theme || 'dracula');
  
  switch(view) {
    case 'team': renderTeamGrid(main); break;
    case 'availability': renderAvailability(main); break;
    case 'run': renderRunCoverage(main); break;
    case 'guests': renderGuests(main); break;
    case 'archived': renderArchived(main); break;
    case 'people': renderPeople(main); break;
    case 'settings': renderSettings(main); break;
    case 'projects': renderProjects(main); break;
    case 'individual': renderIndividual(main); break;

}

function getSlotClass(slotData) {
  if (!slotData || slotData.state === 'not_filled') return 'not-filled';
  if (slotData.state === 'undetermined') return 'undetermined';
  if (slotData.away) return 'away';
  if (slotData.run && slotData.projects && slotData.projects.length > 0) return 'project run';
  if (slotData.run) return 'run';
  if (slotData.projects && slotData.projects.length > 0) return 'project';
  return 'not-filled';
}

// ===== MERGE / LABEL HELPERS =====
function getMergeKey(slotData, weekIndex) {
  // Break merge groups at week boundaries
  const wk = 'w' + weekIndex + ':';
  if (!slotData || slotData.state === 'not_filled') return wk + 'nf';
  if (slotData.state === 'undetermined') return wk + 'und';
  if (slotData.away) return wk + 'away:' + slotData.away.type;
  // Only merge single-project slots (multi-project too complex to merge)
  if (slotData.projects && slotData.projects.length === 1 && !slotData.run) return wk + 'proj:' + slotData.projects[0].name;
  if (slotData.projects && slotData.projects.length === 1 && slotData.run) return wk + 'projrun:' + slotData.projects[0].name;
  if (slotData.run && (!slotData.projects || slotData.projects.length === 0)) return wk + 'run';
  // Multi-project or complex: unique key per slot (no merge)
  return wk + 'complex:' + JSON.stringify(slotData.projects) + ':' + (slotData.run ? '1' : '0');
}

function getCellLabel(slotData) {
  if (!slotData || slotData.state === 'not_filled') return '?';
  if (slotData.state === 'undetermined') return '?';
  if (slotData.away) {
    const abbr = {
      vacation: 'Vac', public_holiday: 'Hol', sick_leave: 'Sick', training: 'Train',
      conference: 'Conf', parental_leave: 'Par', sabbatical: 'Sab', other: 'Other'
    };
    return abbr[slotData.away.type] || slotData.away.type;
  }
  let parts = [];
  if (slotData.projects) slotData.projects.forEach(p => parts.push(p.name));
  if (slotData.run) parts.push('R');
  return parts.join('+');
}

// Build merge groups for a person across visible weeks
function buildSlotGroups(personId, weeks) {
  const allSlots = [];
  weeks.forEach((w, wi) => {
    const days = getWeekDays(w);
    days.forEach((d, di) => {
      if (di >= 5 && !showWeekend) return;
      const ds = fmtDate(d);
      ['am', 'pm'].forEach(slot => {
        const key = getSlotKey(personId, ds, slot);
        const slotData = store.planning[key];
        allSlots.push({ date: ds, slot, slotData, weekIdx: wi, dayIdx: di });
      });
    });
  });
  // Group consecutive slots with same merge key
  const groups = [];
  let cur = null;
  allSlots.forEach(s => {
    const mk = getMergeKey(s.slotData, s.weekIdx);
    if (!cur || cur.mergeKey !== mk) {
      cur = { mergeKey: mk, cells: [s] };
      groups.push(cur);
    } else {
      cur.cells.push(s);
    }
  });
  return groups;
}

function getSlotTitle(person, dateStr, slot, slotData) {
  const p = getPerson(person);
  const name = p ? p.name : person;
  if (!slotData || slotData.state === 'not_filled') return `${name} · ${dateStr} ${slot} · Not filled`;
  if (slotData.state === 'undetermined') return `${name} · ${dateStr} ${slot} · Undetermined project`;
  if (slotData.away) return `${name} · ${dateStr} ${slot} · Away: ${slotData.away.type}${slotData.away.note ? ' ('+slotData.away.note+')' : ''}`;
  let parts = [];
  if (slotData.projects) slotData.projects.forEach(p => parts.push(`${p.name} ${p.pct}%`));
  if (slotData.run) parts.push('Run');
  return `${name} · ${dateStr} ${slot} · ${parts.join(' + ')}`;
}

  <div style="margin-bottom:8px;display:flex;gap:8px;align-items:center">
    <label>Mode: </label>

      <option value="rotation" ${mode==='rotation'?'selected':''}>Rotation</option>
    </select>
  </div>
  <div class="run-view">`;
  
  weeks.forEach(w => {
    const ws = formatWeekStart(w);
    const coverage = calcRunCoveragePerSlot(ws);
    let anyBelow = false;
    
    html += `<div class="week-card">
      <div class="week-title">Week ${getWeekNumber(w)} — ${ws}</div>`;
    
    // Per-half-day coverage table
    html += '<table class="slot-coverage-table"><thead><tr><th>Day</th><th>AM</th><th>PM</th></tr></thead><tbody>';
    coverage.forEach(day => {
      ['am','pm'].forEach(slot => { if (day[slot].onRun < runTarget) anyBelow = true; });
      const amCls = day.am.onRun < runTarget ? 'below' : 'met';
      const pmCls = day.pm.onRun < runTarget ? 'below' : 'met';
      html += `<tr><td>${day.dayName}</td><td class="${amCls}">${day.am.onRun}/${runTarget}</td><td class="${pmCls}">${day.pm.onRun}/${runTarget}</td></tr>`;
    });
    html += '</tbody></table>';
    
    if (anyBelow) {
      html += `<div class="warning-banner">⚠️ Some half-day slots below target of ${runTarget} persons on run</div>`;
    }
    
    // List who's on run
    if (mode === 'rotation') {
      const runPeople = getRunPeople(ws);
      html += `<div style="font-size:.8rem;margin-top:4px">On run: ${runPeople.length > 0 ? runPeople.map(p => p.name).join(', ') : 'None assigned'}</div>`;
      html += `<div style="margin-top:4px"><button onclick="showRotationModal('${ws}')">Assign Run Person</button></div>`;
    } else {
      const people = getActivePeople();
      const runPeople = people.filter(p => calcRunRatio(p.id, ws).run > 0).map(p => `${p.avatar.emoji} ${p.name} (${calcRunRatio(p.id, ws).run}h)`);
      if (runPeople.length > 0) html += `<div style="font-size:.75rem;margin-top:4px">On run: ${runPeople.join(', ')}</div>`;
    }
    
    html += '</div>';
  });
  
  html += '</div>';
  container.innerHTML = html;
}

// ===== AVAILABILITY VIEW =====
function renderAvailability(container) {
  const people = getActivePeople();
  const now = new Date();
  const selDay = new Date(now);
  selDay.setDate(selDay.getDate() + availabilityDayOffset);
  const selDate = fmtDate(selDay);
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dayIdx = (selDay.getDay() + 6) % 7; // 0=Mon
  const dayName = dayNames[dayIdx];
  const today = fmtDate(now);
  const isToday = availabilityDayOffset === 0;
  const currentSlot = now.getHours() < 12 ? 'am' : 'pm';
  
  let html = `<h2>Where is everyone — ${dayName} ${selDate}</h2>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
    <button onclick="availabilityDayOffset--;render()">◀ Previous day</button>
    <button onclick="availabilityDayOffset=0;render()">Today</button>
    <button onclick="availabilityDayOffset++;render()">Next day ▶</button>
  </div>`;
  
  // Per-person cards showing AM and PM for the selected day
  html += '<div class="avail-grid">';
  people.forEach(p => {
    ['am','pm'].forEach(slot => {
      const key = getSlotKey(p.id, selDate, slot);
      const sd = store.planning[key];
      const cls = getSlotClass(sd);
      const label = getSlotLabel(sd);
      const isNow = isToday && slot === currentSlot;
      const bgStyle = cls.includes('project') && projectColorBg(sd) ? ` style="background:${projectColorBg(sd)}"` : '';
      return { slot, cls, label, sd, isNow, bgStyle };
    });
    
    // AM status
    const amKey = getSlotKey(p.id, selDate, 'am');
    const amSd = store.planning[amKey];
    const amCls = getSlotClass(amSd);
    const amLabel = getSlotLabel(amSd);
    const amBgStyle = amCls.includes('project') && projectColorBg(amSd) ? ` style="background:${projectColorBg(amSd)}"` : '';
    
    // PM status
    const pmKey = getSlotKey(p.id, selDate, 'pm');
    const pmSd = store.planning[pmKey];
    const pmCls = getSlotClass(pmSd);
    const pmLabel = getSlotLabel(pmSd);
    const pmBgStyle = pmCls.includes('project') && projectColorBg(pmSd) ? ` style="background:${projectColorBg(pmSd)}"` : '';
    
    // Detailed status text
    function slotDetail(sd) {
      if (!sd || sd.state === 'not_filled') return 'Available';
      if (sd.state === 'undetermined') return 'Project (TBD)';
      if (sd.away) return `Away: ${sd.away.type.replace('_',' ')}`;
      const pn = sd.projects ? sd.projects.map(p=>p.name).join(', ') : '';
      return sd.run ? `${pn} + Run` : (pn || 'Available');
    }
    
    html += `<div class="avail-card">
      <div class="name">${p.avatar.emoji} ${p.name}</div>
      <div style="font-size:.75rem;color:var(--fg-muted);margin-bottom:4px">${p.role || ''}</div>
      <div style="display:flex;gap:6px;margin-top:4px">
        <div style="flex:1;min-width:0">
          <div style="font-size:.7rem;color:var(--fg-muted);margin-bottom:2px">AM${isToday && currentSlot === 'am' ? ' ●' : ''}</div>
          <div class="status ${amCls}"${amBgStyle}${isToday && currentSlot === 'am' ? ' style="outline:2px solid var(--accent);' + (amBgStyle ? amBgStyle.match(/background:[^;"]+/)[0] : '') + '"' : ''}>${escapeHtml(slotDetail(amSd))}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:.7rem;color:var(--fg-muted);margin-bottom:2px">PM${isToday && currentSlot === 'pm' ? ' ●' : ''}</div>
          <div class="status ${pmCls}"${pmBgStyle}${isToday && currentSlot === 'pm' ? ' style="outline:2px solid var(--accent);' + (pmBgStyle ? pmBgStyle.match(/background:[^;"]+/)[0] : '') + '"' : ''}>${escapeHtml(slotDetail(pmSd))}</div>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  
  // Day summary
  let awayCount = 0, runCount = 0, projectCount = 0, notFilledCount = 0, undeterminedCount = 0;
  people.forEach(p => {
    ['am','pm'].forEach(slot => {
      const key = getSlotKey(p.id, selDate, slot);
      const sd = store.planning[key];
      if (!sd || sd.state === 'not_filled') notFilledCount++;
      else if (sd.state === 'undetermined') undeterminedCount++;
      else if (sd.away) awayCount++;
      else if (sd.run) runCount++;
      else projectCount++;
    });
  });
  html += `<h3 style="margin-top:20px">Day Summary — ${dayName} ${selDate}</h3>
  <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem">
    <span style="color:var(--slot-away)">${awayCount} away</span>
    <span style="color:var(--slot-run)">${runCount} run</span>
    <span style="color:var(--slot-project)">${projectCount} project</span>
    <span style="color:var(--fg-muted)">${undeterminedCount} undetermined</span>
    <span style="color:var(--fg-muted)">${notFilledCount} unassigned</span>
  </div>`;
  
  container.innerHTML = html;
}

  }

  <div style="margin-bottom:8px"><button onclick="showAddPersonModal(true)">➕ Add Guest</button></div>
  <div class="grid-container"><table class="grid-table"><thead><tr><th class="person-col">Guest</th>`;
  
  weeks.forEach((w, wi) => {
    const ws = formatWeekStart(w);
    const weekNum = getWeekNumber(w);
    const sep = wi > 0 ? ' week-start' : '';
    html += `<th colspan="${showWeekend ? 14 : 10}" class="${sep}">W${weekNum} ${ws.slice(5)}</th>`;
  });
  html += '</tr><tr><th class="person-col"></th>';
  weeks.forEach((w, wi) => {
    const days = getWeekDays(w);
    const dayNames = showWeekend ? ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] : ['Mon','Tue','Wed','Thu','Fri'];
    days.forEach((d, di) => {
      if (di >= 5 && !showWeekend) return;
      const sep = (di === 0 && wi > 0) ? ' week-start' : '';
      html += `<th colspan="2" class="day-header${sep}">${dayNames[di]}</th>`;
    });
  });
  html += '</tr></thead><tbody>';
  
  // Build slot list
  const allSlots = [];
  weeks.forEach((w, wi) => {
    const days = getWeekDays(w);
    days.forEach((d, di) => {
      if (di >= 5 && !showWeekend) return;
      const ds = fmtDate(d);
      ['am','pm'].forEach(slot => allSlots.push({ date: ds, slot, weekIdx: wi, dayIdx: di }));
    });
  });
  
  guests.forEach((p, rowIdx) => {
    html += `<tr><td class="person-col" onclick="showIndividual('${p.id}')">${p.avatar.emoji} ${p.name}</td>`;
    let prevMergeKey = null;
    allSlots.forEach((sl, colIdx) => {
      const key = getSlotKey(p.id, sl.date, sl.slot);
      const slotData = store.planning[key];
      const cls = getSlotClass(slotData);
      const label = getCellLabel(slotData);
      const mk = getMergeKey(slotData, sl.weekIdx);
      const isMergedCont = (mk === prevMergeKey);
      const sep = (sl.dayIdx === 0 && sl.slot === 'am' && sl.weekIdx > 0) ? ' week-start' : '';
      const mergeCls = isMergedCont ? ' merged-cont' : '';
      const title = getSlotTitle(p, sl.date, sl.slot, slotData);
      const showLabel = !isMergedCont || cls.includes('not-filled');
      let bgStyle = '';
      if (cls.includes('project')) {
        const bg = projectColorBg(slotData);
        if (bg) bgStyle = ` style="background:${bg}"`;
      }
      const onCallCls = isOnCall(p.id, formatWeekStart(weeks[sl.weekIdx])) ? ' on-call' : '';
      html += `<td class="half-day ${cls}${sep}${mergeCls}${onCallCls}" data-person="${p.id}" data-date="${sl.date}" data-slot="${sl.slot}" data-row="${rowIdx}" data-col="${colIdx}" onmousedown="startDrag(event,'${p.id}','${sl.date}','${sl.slot}',${rowIdx},${colIdx})" title="${title}"${bgStyle}>${showLabel ? `<span class="cell-label">${escapeHtml(label)}</span>` : ''}</td>`;
      prevMergeKey = mk;
    });
    html += '</tr>';
  });
  
  html += '</tbody></table></div>';
  
  // Navigation
  html += `<div style="display:flex;gap:8px;align-items:center;margin-top:8px">
    <button onclick="scrollOffset--;store.settings._scrollOffset=scrollOffset;saveStore();render()">◀ Earlier</button>
    <span>Weeks ${formatWeekStart(weeks[0]).slice(5)} – ${formatWeekStart(weeks[weeks.length-1]).slice(5)}</span>
    <button onclick="scrollOffset++;store.settings._scrollOffset=scrollOffset;saveStore();render()">Later ▶</button>
    <button onclick="scrollOffset=0;store.settings._scrollOffset=scrollOffset;saveStore();render()" style="margin-left:8px">Today</button>
  </div>`;
  
  container.innerHTML = html;
}

function renderGanttView() {
  let projects = store.projects.slice();
  // Projects with no dates (start AND end) always go to bottom
  const withDates = projects.filter(p => p.start_date || p.end_date);
  const noDates = projects.filter(p => !p.start_date && !p.end_date);
  // Sort dated projects by selected criteria
  if (projectsSortBy === 'start') withDates.sort((a,b) => (a.start_date||'9999').localeCompare(b.start_date||'9999'));
  else if (projectsSortBy === 'end') withDates.sort((a,b) => (a.end_date||'9999').localeCompare(b.end_date||'9999'));
  else withDates.sort((a,b) => a.name.localeCompare(b.name));
  // No-date projects sorted by name at the bottom
  noDates.sort((a,b) => a.name.localeCompare(b.name));
  projects = withDates.concat(noDates);
  
  // Determine date range
  const now = new Date();
  const nowStr = fmtDate(now);
  let minDate = nowStr, maxDate = nowStr;
  projects.forEach(p => {
    if (p.start_date && p.start_date < minDate) minDate = p.start_date;
    if (p.end_date && p.end_date > maxDate) maxDate = p.end_date;
  });
  // Pad range by 1 week
  const minD = parseDate(minDate) || now;
  const maxD = parseDate(maxDate) || now;
  minD.setDate(minD.getDate() - 7);
  maxD.setDate(maxD.getDate() + 7);
  const totalDays = Math.max(1, Math.round((maxD - minD) / 86400000));
  
  // Generate week markers
  const weeks = [];
  const w = new Date(minD);
  w.setHours(0,0,0,0);
  w.setDate(w.getDate() - ((w.getDay() + 6) % 7)); // Monday
  while (w <= maxD) {
    weeks.push(new Date(w));
    w.setDate(w.getDate() + 7);
  }
  const colCount = weeks.length;
  const colWidth = 60; // px per week
  
  let html = `<div style="margin-bottom:8px;display:flex;gap:8px;align-items:center">
    <span style="font-size:.85rem;color:var(--fg-muted)">Sort by:</span>
    <button onclick="projectsSortBy='name';render()" style="font-weight:${projectsSortBy==='name'?'700':'400'}">Name</button>
    <button onclick="projectsSortBy='start';render()" style="font-weight:${projectsSortBy==='start'?'700':'400'}">Start date</button>
    <button onclick="projectsSortBy='end';render()" style="font-weight:${projectsSortBy==='end'?'700':'400'}">End date</button>
  </div>`;
  
  if (projects.length === 0) return '<p style="color:var(--fg-muted)">No projects to display.</p>';
  
  // Gantt table
  html += '<div class="gantt-container"><table class="gantt-table"><thead><tr><th style="text-align:left;min-width:140px;position:sticky;left:0;z-index:3;background:var(--surface)">Project</th>';
  weeks.forEach(wk => {
    const label = 'W' + getWeekNumber(wk) + ' ' + fmtDate(wk).slice(5);
    html += `<th style="min-width:${colWidth}px">${label}</th>`;
  });
  html += '</tr></thead><tbody>';
  
  projects.forEach(proj => {
    const statusColor = STATUS_COLORS[proj.status] || '#6c757d';
    const projStart = proj.start_date ? parseDate(proj.start_date) : null;
    const projEnd = proj.end_date ? parseDate(proj.end_date) : null;
    const peopleNow = getPeopleOnProjectNow(proj.name);
    const hasNoPeopleNow = proj.status === 'in_progress' && peopleNow.length === 0;
    
    // Compute bar position in week columns
    let startCol = 0, endCol = colCount - 1;
    if (projStart) {
      const dayDiff = Math.round((projStart - weeks[0]) / 86400000);
      startCol = Math.max(0, Math.floor(dayDiff / 7));
    }
    if (projEnd) {
      const dayDiff = Math.round((projEnd - weeks[0]) / 86400000);
      endCol = Math.min(colCount - 1, Math.ceil(dayDiff / 7));
    }
    if (startCol > endCol) endCol = startCol;
    
    const span = endCol - startCol + 1;
    const peopleText = peopleNow.map(p => p.name).join(', ') || 'No one currently assigned';
    const tooltip = `${escapeHtml(proj.name)} — ${STATUS_LABELS[proj.status]||proj.status}\nPeople now: ${peopleText}`;
    
    // Now line position (fractional column)
    const nowDayDiff = Math.round((now - weeks[0]) / 86400000);
    const nowCol = nowDayDiff / 7;
    
    // Build row with empty cells and bar spanning
    html += `<tr class="gantt-row"><td style="text-align:left;position:sticky;left:0;background:var(--surface);z-index:1">${proj.emoji} ${escapeHtml(proj.name)}</td>`;
    for (let c = 0; c < colCount; c++) {
      if (c === startCol) {
        const nowInBar = nowCol >= startCol && nowCol <= endCol + 1;
        let barStyle = `background:${statusColor};`;
        if (hasNoPeopleNow && nowInBar) barStyle += 'border:2px dashed var(--danger);';
        if (proj.status === 'paused') barStyle += 'opacity:.6;background:#ff9800;';
        if (proj.status === 'done') barStyle += 'opacity:.4;';
        if (proj.status === 'unstarted') barStyle += 'opacity:.5;';
        html += `<td colspan="${span}" style="padding:3px;position:relative">
          <div class="gantt-bar status-${proj.status}${hasNoPeopleNow ? ' no-people' : ''}" style="${barStyle}" title="${tooltip}">${escapeHtml(proj.name)}</div>
          ${nowInBar ? `<div class="gantt-now-line" style="left:${((nowCol - c) / span) * 100}%"></div>` : ''}
        </td>`;
        c += span - 1;
      } else {
        html += '<td></td>';
      }
    }
    html += '</tr>';
  });
  
  html += '</tbody></table></div>';
  return html;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  // Detect header
  const header = lines[0].toLowerCase().trim();
  const hasHeader = header.includes('name') && header.includes('status');
  const dataLines = hasHeader ? lines.slice(1) : lines;
  return dataLines.map(line => {
    // Simple CSV parse (handles quoted fields)
    const fields = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (inQ) { if (c === '"' && line[i+1] !== '"') inQ = false; else if (c === '"' && line[i+1] === '"') { cur += '"'; i++; } else cur += c; }
      else { if (c === '"') inQ = true; else if (c === ',') { fields.push(cur); cur = ''; } else cur += c; }
    }
    fields.push(cur);
    return fields;
  }).filter(f => f.length >= 1 && f[0].trim());
}

function doProjectCSVImport() {
  let csvText = '';
  const file = document.getElementById('project-csv-file').files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) { processProjectCSV(e.target.result); };
    reader.readAsText(file);
    return;
  }
  csvText = document.getElementById('project-csv-paste').value.trim();
  if (!csvText) { alert('Please select a file or paste CSV content.'); return; }
  processProjectCSV(csvText);
}

function processProjectCSV(text) {
  const rows = parseCSV(text);
  if (rows.length === 0) { alert('No valid rows found in CSV.'); return; }
  pushUndo();
  let created = 0, updated = 0;
  rows.forEach(fields => {
    const [name, emoji, description, url, start_date, end_date, status] = fields.map(f => (f||'').trim());
    if (!name) return;
    const validStatus = PROJECT_STATUSES.includes(status) ? status : 'unstarted';
    const existing = getProjectByName(name);
    if (existing) {
      updateProjectNoUndo(existing.id, { emoji: emoji||existing.emoji, description, url, start_date, end_date, status: validStatus });
      updated++;
    } else {
      addProjectNoUndo({ name, emoji: emoji||'📁', description, url, start_date, end_date, status: validStatus });
      created++;
    }
  });
  saveStore();
  closeModal();
  render();
  alert(`Import complete: ${created} created, ${updated} updated.`);
}

  const p = getProject(id);

// ===== DRAG SELECTION SYSTEM (rectangular: horizontal + vertical) =====

function startDrag(event, personId, date, slot, row, col) {
  event.preventDefault();
  dragState = {
    startRow: row, startCol: col,
    startPersonId: personId, startDate: date, startSlot: slot,
    endRow: row, endCol: col,
    isDragging: false
  };
  document.addEventListener('mouseup', endDrag);
}

function extendDrag(event) {
  if (!dragState) return;
  const td = event.target.closest('td.half-day');
  if (!td) return;
  const endRow = parseInt(td.dataset.row);
  const endCol = parseInt(td.dataset.col);
  if (isNaN(endRow) || isNaN(endCol)) return;
  if (endRow === dragState.endRow && endCol === dragState.endCol) return; // no change
  dragState.endRow = endRow;
  dragState.endCol = endCol;
  dragState.isDragging = true;
  // Highlight rectangular selection
  const loRow = Math.min(dragState.startRow, endRow);
  const hiRow = Math.max(dragState.startRow, endRow);
  const loCol = Math.min(dragState.startCol, endCol);
  const hiCol = Math.max(dragState.startCol, endCol);
  clearDragHighlight();
  document.querySelectorAll('td.half-day').forEach(td2 => {
    const r = parseInt(td2.dataset.row);
    const c = parseInt(td2.dataset.col);
    if (!isNaN(r) && !isNaN(c) && r >= loRow && r <= hiRow && c >= loCol && c <= hiCol) {
      td2.classList.add('in-range');
    }
  });
}

function clearDragHighlight() {
  document.querySelectorAll('.half-day.in-range').forEach(td => td.classList.remove('in-range'));
}

function endDrag(event) {
  document.removeEventListener('mouseup', endDrag);
  if (!dragState) return;
  const wasDrag = dragState.isDragging;
  const loRow = Math.min(dragState.startRow, dragState.endRow);
  const hiRow = Math.max(dragState.startRow, dragState.endRow);
  const loCol = Math.min(dragState.startCol, dragState.endCol);
  const hiCol = Math.max(dragState.startCol, dragState.endCol);
  clearDragHighlight();
  dragState = null;
  if (!wasDrag) {
    // Single click — open single cell editor
    openCellEditorFromGrid(loRow, loCol);
  } else {
    // Collect all selected cells
    const selectedCells = [];
    document.querySelectorAll('td.half-day').forEach(td => {
      const r = parseInt(td.dataset.row);
      const c = parseInt(td.dataset.col);
      if (!isNaN(r) && !isNaN(c) && r >= loRow && r <= hiRow && c >= loCol && c <= hiCol) {
        selectedCells.push({ personId: td.dataset.person, date: td.dataset.date, slot: td.dataset.slot });
      }
    });
    openRangeEditor(selectedCells);
  }
}

function openCellEditorFromGrid(row, col) {
  const td = document.querySelector(`td.half-day[data-row="${row}"][data-col="${col}"]`);
  if (td) openCellEditor(td.dataset.person, td.dataset.date, td.dataset.slot);
}

// Generate all {date, slot} pairs from start to end chronologically
function generateSlotsInRange(startDate, startSlot, endDate, endSlot) {
  const result = [];
  const start = parseDate(startDate);
  const end = parseDate(endDate);
  if (!start || !end) return result;
  let curDate = new Date(start);
  let curSlot = startSlot;
  while (curDate < end || (curDate.getTime() === end.getTime() && curSlot <= endSlot)) {
    result.push({ date: fmtDate(curDate), slot: curSlot });
    if (curSlot === 'am') { curSlot = 'pm'; } else { curSlot = 'am'; curDate = new Date(curDate); curDate.setDate(curDate.getDate() + 1); }
  }
  return result;
}

// Recompute cells from edited dates and stored person IDs
function getRangeEditorCells() {
  const startDate = document.getElementById('range-start-date').value.trim();
  const startSlot = document.getElementById('range-start-slot').value;

  const endSlot = document.getElementById('range-end-slot').value;
  const slots = generateSlotsInRange(startDate, startSlot, endDate, endSlot);
  const cells = [];
  rangeEditorPersonIds.forEach(pid => {
    slots.forEach(sl => cells.push({ personId: pid, date: sl.date, slot: sl.slot }));
  });
  return cells;
}

  if (!rangeEditorCells) return;
  const awayType = document.getElementById('range-away-type').value;
  const run = document.getElementById('range-run').checked;
  
  // Collect projects from the list
  const projects = [];
  let total = 0;
  const list = document.getElementById('range-project-list');
  Array.from(list.children).forEach(row => {
    const nameInput = row.querySelector('input[type="text"]');
    const pctInput = row.querySelector('input[type="number"]');
    const name = nameInput ? nameInput.value.trim() : '';
    const pct = pctInput ? (+pctInput.value || 0) : 0;
    if (name) { projects.push({ name, pct }); total += pct; }
  });
  
  if (total > 100) {
    alert('Total project percentage cannot exceed 100%. Current total: ' + total + '%');
    return;
  }
  
  const cells = getRangeEditorCells();
  pushUndo();
  cells.forEach(c => {
    if (awayType) {
      setSlotNoUndo(c.personId, c.date, c.slot, { state: 'filled', away: { type: awayType, note: '' }, projects: [], run: false });
    } else if (projects.length > 0) {
      setSlotNoUndo(c.personId, c.date, c.slot, { state: 'filled', away: null, projects, run });

      setSlotNoUndo(c.personId, c.date, c.slot, { state: 'filled', away: null, projects: [], run: true });

  });
  saveStore();
  rangeEditorCells = null;

    <button data-tab="clear" onclick="clearSlot()">Clear</button>
  </div>`;
  
  // Project tab
  const isAway = slotData && slotData.away;
  const isUndetermined = slotData && slotData.state === 'undetermined';
  const projects = (slotData && slotData.projects) ? clone(slotData.projects) : [{ name: '', pct: 100 }];
  const runChecked = slotData && slotData.run;
  
  html += `<div id="editor-tab-project" class="tab-content ${isAway || isUndetermined ? 'hidden' : ''}">
    <div id="project-list">`;
  projects.forEach((proj, i) => {
    html += `<div class="project-row">
      <input type="text" value="${proj.name}" placeholder="Project name" list="project-names" data-idx="${i}" onchange="updateProjectName(${i},this.value)">
      <input type="number" min="0" max="100" value="${proj.pct}" data-idx="${i}" onchange="updateProjectPct(${i},+this.value)">
      <span>%</span>
      ${projects.length > 1 ? `<button onclick="removeProject(${i})">✕</button>` : ''}
    </div>`;
  });
  html += `</div>
    <button onclick="addEditorProject()" style="font-size:.8rem;margin-top:4px">+ Add Project</button>
    <div class="pct-total" id="pct-total">Total: ${sum(projects.map(p=>p.pct))}%</div>
    <div style="margin-top:8px">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" ${runChecked ? 'checked' : ''} onchange="editorRunToggle=this.checked"> 🏃 Run duty
      </label>
    </div>
  </div>`;
  
  // Away tab
  const awayTypes = ['vacation','public_holiday','sick_leave','training','conference','parental_leave','sabbatical','other'];
  const currentAway = isAway ? slotData.away.type : '';
  const currentNote = isAway ? (slotData.away.note || '') : '';
  
  html += `<div id="editor-tab-away" class="tab-content ${isAway ? '' : 'hidden'}">
    <div class="form-row"><label>Type</label><select id="away-type">`;
  awayTypes.forEach(t => {
    html += `<option value="${t}" ${currentAway === t ? 'selected' : ''}>${t.replace('_',' ')}</option>`;
  });
  html += `</select></div>
    <div class="form-row"><label>Note (optional)</label><input type="text" id="away-note" value="${currentNote}" placeholder="e.g. Family vacation"></div>
  </div>`;
  
  html += `<div class="form-actions">
    <button onclick="closeCellEditor()">Cancel</button>
    <button onclick="saveCellEditor()" class="primary">Save</button>
  </div>`;
  
  html += projectNamesDatalist();
  editor.innerHTML = html;
  editor.classList.remove('hidden');
  
  // Position near the click
  // We'll just center it for simplicity
  editor.style.top = '50%';
  editor.style.left = '50%';
  editor.style.transform = 'translate(-50%,-50%)';
  
  // Store run toggle state
  window.editorRunToggle = runChecked;
}

function switchEditorTab(tab) {
  const editor = document.getElementById('cell-editor');
  editor.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  editor.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
  const tabBtn = editor.querySelector(`.tabs button[data-tab="${tab}"]`);
  if (tabBtn) tabBtn.classList.add('active');
  const tabContent = document.getElementById(`editor-tab-${tab}`);
  if (tabContent) tabContent.classList.remove('hidden');
}

function addEditorProject() {
  const list = document.getElementById('project-list');
  const idx = list.children.length;
  const div = document.createElement('div');
  div.className = 'project-row';
  div.innerHTML = `<input type="text" value="" placeholder="Project name" list="project-names" data-idx="${idx}" onchange="updateProjectName(${idx},this.value)">
    <input type="number" min="0" max="100" value="50" data-idx="${idx}" onchange="updateProjectPct(${idx},+this.value)">
    <span>%</span>
    <button onclick="removeProject(${idx})">✕</button>`;
  list.appendChild(div);
  updatePctTotal();
}

function removeProject(idx) {
  const rows = document.getElementById('project-list').children;
  if (rows.length <= 1) return;
  rows[idx].remove();
  // Re-index
  Array.from(document.getElementById('project-list').children).forEach((row, i) => {
    row.querySelectorAll('input').forEach(inp => inp.dataset.idx = i);
    row.querySelector('button').onclick = () => removeProject(i);
  });
  updatePctTotal();
}

function updateProjectName(idx, val) {
  updatePctTotal();
}

function updateProjectPct(idx, val) {
  updatePctTotal();
}

function updatePctTotal() {
  const rows = document.getElementById('project-list').children;
  let total = 0;
  Array.from(rows).forEach(row => {
    const pctInput = row.querySelector('input[type="number"]');
    if (pctInput) total += +pctInput.value || 0;
  });
  const el = document.getElementById('pct-total');
  el.textContent = `Total: ${total}%`;
  el.classList.toggle('over', total > 100);
}

function saveCellEditor() {
  // Check which tab is active
  const awayTab = document.getElementById('editor-tab-away');
  if (awayTab && !awayTab.classList.contains('hidden')) {
    // Away tab is active — save away type
    const type = document.getElementById('away-type').value;
    const note = document.getElementById('away-note').value;
    setSlot(editorPersonId, editorDate, editorSlot, { state: 'filled', away: { type, note }, projects: [], run: false });
    closeCellEditor();
    render();
  } else {
    // Project tab is active
    applyProjectEditor();
  }
}

function applyAway() {
  const type = document.getElementById('away-type').value;
  const note = document.getElementById('away-note').value;
  const data = { state: 'filled', away: { type, note }, projects: [], run: false };
  setSlot(editorPersonId, editorDate, editorSlot, data);
  closeCellEditor();
  render();
}

function setUndetermined() {
  const data = { state: 'undetermined', away: null, projects: [], run: false };
  setSlot(editorPersonId, editorDate, editorSlot, data);
  closeCellEditor();
  render();
}

function clearSlot() {
  setSlot(editorPersonId, editorDate, editorSlot, null);
  closeCellEditor();
  render();
}

function applyProjectEditor() {
  const rows = document.getElementById('project-list').children;
  const projects = [];
  let total = 0;
  Array.from(rows).forEach(row => {
    const name = row.querySelector('input[type="text"]').value.trim();
    const pct = +row.querySelector('input[type="number"]').value || 0;
    if (name) {
      projects.push({ name, pct });
      total += pct;
    }
  });
  
  if (total > 100) {
    alert('Total project percentage cannot exceed 100%. Current total: ' + total + '%');
    return;
  }
  
  const data = {
    state: 'filled',
    away: null,
    projects: projects.length > 0 ? projects : [],
    run: !!window.editorRunToggle
  };
  
  if (data.projects.length === 0 && !data.run) {
    data.state = 'not_filled';
  }
  
  setSlot(editorPersonId, editorDate, editorSlot, data);
  closeCellEditor();
  render();
}

function closeCellEditor() {
  document.getElementById('cell-editor').classList.add('hidden');
  editorPersonId = null;
  editorDate = null;
  editorSlot = null;
}

      </select>

      <label>File type</label>
      <select id="import-type">
        <option value="planning">Planning data (people + planning)</option>

      </select>
