function doImport() {
  const file = document.getElementById('import-file').files[0];
  if (!file) { alert('Please select a file.'); return; }
  const mode = document.getElementById('import-mode').value;
  const type = document.getElementById('import-type').value;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      if (type === 'holidays') {
        importHolidays(text);
      } else {
        importPlanning(text, mode);
      }
      closeModal();
      render();
    } catch(err) {
      alert('Import error: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function importPlanning(text, mode) {
  const data = parseTOML(text);
  
  if (mode === 'replace') {
    if (!confirm('This will replace ALL current data. Continue?')) return;
    pushUndo();
    store.people = [];
    store.planning = {};
    store.rotation = {};
  } else {
    pushUndo();
  }
  
  // Import people
  if (data.people && Array.isArray(data.people)) {
    data.people.forEach(p => {
      // Check if person already exists by name
      const existing = store.people.find(sp => sp.name === p.name);
      if (existing) {
        // Update existing
        Object.assign(existing, {
          role: p.role || existing.role,
          sub_team: p.sub_team || existing.sub_team,
          default_projects: p.default_projects || existing.default_projects,
          status: p.status || existing.status,
          guest: p.guest !== undefined ? p.guest : existing.guest
        });
        if (p.avatar) {
          existing.avatar = { emoji: p.avatar.emoji || existing.avatar.emoji, color: p.avatar.color || existing.avatar.color };
        }
      } else {
        // Add new — preserve original ID if present
        store.people.push({
          id: p.id || uid(),
          name: p.name || 'Unknown',
          role: p.role || '',
          sub_team: p.sub_team || '',
          avatar: { emoji: (p.avatar && p.avatar.emoji) || '👤', color: (p.avatar && p.avatar.color) || randomColor() },
          start_date: p.start_date || fmtDate(new Date()),
          default_projects: p.default_projects || [],
          status: p.status || 'active',
          archived_date: p.archived_date || '',
          guest: !!p.guest
        });
      }
    });
  }
  
  // Import planning
  if (data.planning && Array.isArray(data.planning)) {
    data.planning.forEach(entry => {
      // Find person by name or id
      const person = store.people.find(p => p.id === entry.person_id || p.name === entry.person_id);
      if (!person) return;
      
      const key = getSlotKey(person.id, entry.date, entry.slot);
      store.planning[key] = {
        state: entry.state || 'filled',
        away: entry.away_type ? { type: entry.away_type, note: entry.away_note || '' } : null,
        projects: Array.isArray(entry.projects) ? entry.projects : [],
        run: !!entry.run
      };
    });
  }
  
  // Import settings
  if (data.settings) {
    Object.keys(data.settings).forEach(k => {
      if (store.settings[k] !== undefined) {
        store.settings[k] = data.settings[k];
      }
    });
  }
  
  // Import projects
  if (data.projects && Array.isArray(data.projects)) {
    data.projects.forEach(p => {
      const existing = getProjectByName(p.name || '');
      if (existing) {
        updateProjectNoUndo(existing.id, {
          emoji: p.emoji || existing.emoji,
          description: p.description || existing.description,
          url: p.url || existing.url,
          start_date: p.start_date || existing.start_date,
          end_date: p.end_date || existing.end_date,
          status: p.status || existing.status
        });
      } else {
        addProjectNoUndo({
          name: p.name || 'Unknown',
          emoji: p.emoji || '📁',
          description: p.description || '',
          url: p.url || '',
          start_date: p.start_date || '',
          end_date: p.end_date || '',
          status: p.status || 'unstarted'
        });
      }
    });
  }
  
  saveStore();
}

function importHolidays(text) {
  const data = parseTOML(text);
  if (!data.holidays || !Array.isArray(data.holidays)) {
    alert('No holidays found in file.');
    return;
  }
  
  const count = data.holidays.length;
  if (!confirm(`Found ${count} holidays. Auto-fill as away entries for all active team members?`)) return;
  
  pushUndo();
  const people = getActivePeople();
  let filled = 0;
  
  data.holidays.forEach(h => {
    const date = h.date;
    if (!date) return;
    people.forEach(p => {
      ['am','pm'].forEach(slot => {
        const key = getSlotKey(p.id, date, slot);
        // Don't overwrite existing entries
        if (!store.planning[key]) {
          store.planning[key] = {
            state: 'filled',
            away: { type: 'public_holiday', note: h.label || '' },
            projects: [],
            run: false
          };
          filled++;
        }
      });
    });
  });
  
  saveStore();
  alert(`Filled ${filled} half-day slots with public holidays.`);
}

function doExport() {
  const now = new Date();
  const counter = String(store.settings.export_counter).padStart(3, '0');
  const filename = `${fmtExportTS(now)}-${counter}.toml`;
  store.settings.export_counter++;
  saveStore();
  
  // Build TOML
  let toml = `schema_version = 1\nexported_at = "${fmtDateTime(now)}"\n\n`;
  
  // Settings
  toml += '[settings]\n';
  Object.keys(store.settings).forEach(k => {
    if (k === 'export_counter') return;
    toml += `${k} = ${serializeTOMLValue(store.settings[k])}\n`;
  });
  
  // People
  toml += '\n';
  store.people.forEach(p => {
    toml += `[[people]]\n`;
    toml += `id = "${p.id}"\n`;
    toml += `name = "${p.name}"\n`;
    toml += `role = "${p.role || ''}"\n`;
    toml += `sub_team = "${p.sub_team || ''}"\n`;
    toml += `avatar = { emoji = "${p.avatar.emoji}", color = "${p.avatar.color}" }\n`;
    toml += `start_date = "${p.start_date || ''}"\n`;
    toml += `default_projects = [${(p.default_projects || []).map(s => '"'+s.replace(/"/g,'\\"')+'"').join(', ')}]\n`;
    toml += `status = "${p.status}"\n`;
    toml += `archived_date = "${p.archived_date || ''}"\n`;
    toml += `guest = ${p.guest ? 'true' : 'false'}\n\n`;
  });
  
  // On-call
  const onCallKeys = Object.keys(store.oncall || {}).sort();
  onCallKeys.forEach(key => {
    const parts = key.split('|');
    if (parts.length >= 2) {
      toml += `[[oncall]]\nperson_id = "${parts[0]}"\nweek_start = "${parts[1]}"\n\n`;
    }
  });
  
  // Projects
  store.projects.forEach(proj => {
    toml += `[[projects]]\nname = "${proj.name.replace(/"/g,'\\"')}"\nemoji = "${proj.emoji}"\ndescription = "${(proj.description||'').replace(/"/g,'\\"')}"\nurl = "${(proj.url||'').replace(/"/g,'\\"')}"\nstart_date = "${proj.start_date||''}"\nend_date = "${proj.end_date||''}"\nstatus = "${proj.status}"\n\n`;
  });
  
  // Planning
  const planningKeys = Object.keys(store.planning).sort();
  planningKeys.forEach(key => {
    const parts = key.split('|');
    if (parts.length < 3) return;
    const [personId, date, slot] = parts;
    const data = store.planning[key];
    if (!data || data.state === 'not_filled') return;
    
    toml += `[[planning]]\n`;
    toml += `person_id = "${personId}"\n`;
    toml += `date = "${date}"\n`;
    toml += `slot = "${slot}"\n`;
    toml += `state = "${data.state}"\n`;
    toml += `away_type = "${data.away ? data.away.type : ''}"\n`;
    toml += `away_note = "${data.away ? (data.away.note || '') : ''}"\n`;
    toml += `run = ${data.run ? 'true' : 'false'}\n`;
    if (data.projects && data.projects.length > 0) {
      toml += `projects = [\n`;
      data.projects.forEach(proj => {
        toml += `  { name = "${proj.name}", pct = ${proj.pct} },\n`;
      });
      toml += `]\n`;
    } else {
      toml += `projects = []\n`;
    }
    toml += '\n';
  });
  
  downloadFile(toml, filename, 'text/toml');
}

function downloadICS(personId) {
  const weeks = getVisibleWeeks();
  const startDate = formatWeekStart(weeks[0]);
  const endDate = formatWeekStart(weeks[weeks.length-1]);
  const ics = generateICS(personId, startDate, endDate);
  const p = getPerson(personId);
  const name = p ? p.name.replace(/[^a-zA-Z0-9]/g, '_') : personId;
  downloadFile(ics, `${name}_planning.ics`, 'text/calendar');
}

function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ===== COPY LAST WEEK =====
function copyLastWeek(personId) {
  const weeks = getVisibleWeeks();
  if (weeks.length < 2) { alert('Need at least 2 weeks visible to copy.'); return; }
  
  const currentWeekStart = weeks[0];
  const prevWeekStart = addWeeks(currentWeekStart, -1);
  
  const currentDays = getWeekDays(currentWeekStart);
  const prevDays = getWeekDays(prevWeekStart);
  
  if (!confirm('Copy last week\'s assignments to this week? Away entries will be skipped.')) return;
  
  pushUndo();
  let copied = 0;
  
  currentDays.forEach((d, di) => {
    if (di >= 5 && !showWeekend) return; // skip weekends
    const currentDate = fmtDate(d);
    const prevDate = fmtDate(prevDays[di]);
    
    ['am','pm'].forEach(slot => {
      const prevKey = getSlotKey(personId, prevDate, slot);
      const prevData = store.planning[prevKey];
      if (!prevData || prevData.state === 'not_filled' || prevData.away) return; // skip away
      
      const currentKey = getSlotKey(personId, currentDate, slot);
      // Don't overwrite existing data
      if (store.planning[currentKey]) return;
      
      store.planning[currentKey] = clone(prevData);
      copied++;
    });
  });
  
  saveStore();
  render();
  if (copied > 0) {
    // Show brief feedback
    const status = document.getElementById('status-left');
    status.textContent = `📋 Copied ${copied} slots from last week`;
    setTimeout(() => updateStatusBar(), 2000);
  } else {
    alert('No slots were copied (all may already be filled or last week was empty).');
  }
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === 'e') { e.preventDefault(); doExport(); }
  if (e.key === 'Escape') { closeCellEditor(); closeModal(); }
  // Disable single-key shortcuts when focus is in an input/select/textarea
  const tag = (e.target.tagName || '').toLowerCase();
  const inField = tag === 'input' || tag === 'select' || tag === 'textarea';
  if (inField) return;
  if (e.key === 'u' && !e.ctrlKey && !e.metaKey && editorPersonId) {
    setUndetermined();
  }
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey && editorPersonId) {
    window.editorRunToggle = !window.editorRunToggle;
    const editor = document.getElementById('cell-editor');
    const cb = editor.querySelector('input[type="checkbox"]');
    if (cb) cb.checked = window.editorRunToggle;
  }
});
