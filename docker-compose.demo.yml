# ============================================================
# Team Visualizer — Demo with Keycloak + Apache reverse proxy
# ============================================================
# Brings up:
#   1. Keycloak (OIDC auth server, pre-provisioned with 3 users + client)
#   2. Apache (reverse proxy with WebSocket support, TLS-ready)
#   3. Team Visualizer (Go app, talks to Keycloak directly via OIDC)
#
# Users (password = username):
#   admin  → tvz-admin group    → app admin role
#   user   → tvz-normal group   → app normal role
#   rouser → tvz-readonly group → app read-only role
#
# Usage:
#   docker compose -f docker-compose.demo.yml up -d --build
#   open http://localhost:8080
#
# First launch takes ~40s for Keycloak + provisioning.
# Keycloak admin console: http://localhost:8090 (admin/admin)
# ============================================================

services:
  # ---------- Keycloak (OIDC provider) ----------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HOSTNAME: http://localhost:8090
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    ports:
      - "8090:8080"
    command: ["start-dev"]
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------- Keycloak Provisioner (one-shot) ----------
  keycloak-init:
    build:
      context: .
      dockerfile: Dockerfile.keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-keycloak.sh"]
    volumes:
      - ./scripts/init-keycloak.sh:/scripts/init-keycloak.sh:ro
    restart: "no"

  # ---------- Apache (reverse proxy) ----------
  apache:
    build:
      context: .
      dockerfile: Dockerfile.apache
    depends_on:
      teamviz:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  # ---------- Team Visualizer (Go app) ----------
  teamviz:
    build: .
    environment:
      TVZ_JWT_SECRET: demo-jwt-secret-not-for-production
      TVZ_DB_PATH: /data/teamviz.db
      TVZ_LISTEN: ":8080"
      TVZ_ADMIN_GROUP: "tvz-admin"
      TVZ_NORMAL_GROUP: "tvz-normal"
      TVZ_READONLY_GROUP: "tvz-readonly"
      # OIDC (direct Keycloak, no oauth2-proxy)
      TVZ_OIDC_ISSUER: http://localhost:8090/realms/teamviz
      TVZ_OIDC_CLIENT_ID: teamviz-demo
      TVZ_OIDC_CLIENT_SECRET: demo-secret-not-for-production-use
      TVZ_OIDC_REDIRECT_URL: http://localhost:8080/auth/callback
      # Docker-internal host for OIDC backend calls (discovery, JWKS, token exchange).
      # The app's OIDC HTTP client rewrites localhost:8090 → keycloak:8080 at the TCP dial level.
      TVZ_OIDC_INTERNAL_HOST: keycloak:8080
    volumes:
      - teamviz-data:/data
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  keycloak-data:
  teamviz-data:
