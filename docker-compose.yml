services:
  teamviz:
    build: .
    # "dev" listener: X-Dev-User / X-Dev-Groups headers (see teamviz.dev.toml).
    # Only for local testing — never expose untrusted networks to a `dev` port.
    command: ["-config", "/etc/teamviz/teamviz.toml"]
    ports:
      - "8080:8080"
    volumes:
      - teamviz-data:/data
      - ./teamviz.dev.toml:/etc/teamviz/teamviz.toml:ro
    restart: unless-stopped

volumes:
  teamviz-data: